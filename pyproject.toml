[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anthromesh"
version = "0.1.0"
description = "Preference memory, owner escalation, and verifiable delegation for AI agents (MCP + A2A)."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "AnthroMesh Contributors"}
]
keywords = ["ai-agents", "mcp", "a2a", "digital-twin", "human-in-the-loop", "synthetic-cohorts", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
vector = ["sqlite-vec>=0.1.9"]
survey = ["pyarrow>=14"]
agent-sdk = ["httpx>=0.27", "openai-agents>=0.1"]
encryption = ["sqlcipher3>=0.5"]
interop = ["mcp>=2.3,<3", "a2a-sdk>=1.3,<2"]
protocols = [
    "fastapi>=0.115.0",
    "PyJWT[crypto]>=2.10",
    "opentelemetry-api>=1.24",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
all = [
    "anthromesh[protocols,dev]",
]

[project.scripts]
anthromesh = "anthromesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
